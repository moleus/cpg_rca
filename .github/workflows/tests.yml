name: Python regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/rca-validation-2026-11-22
    paths:
      - .github/workflows/tests.yml
      - src/**
      - tests/**
      - eval/**
      - builder.py
      - runtime_analyzer.py
      - visualize.py
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        data_stack: [measured, declared]
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r eval/requirements-test.txt
      - name: Use the declared data library versions
        if: matrix.data_stack == 'declared'
        run: python -m pip install pandas==3.1.1 numpy==2.4.6 matplotlib==3.10.9
      - name: Run regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-tests-${{ matrix.data_stack }}-${{ github.run_id }}
          path: test-results.xml
          retention-days: 14
          if-no-files-found: warn
