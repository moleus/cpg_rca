name: Controlled OpenSearch comparison

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/opensearch-controlled-benchmark

permissions:
  contents: read

concurrency:
  group: controlled-opensearch-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare-cpg:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opensearch-project/OpenSearch
          ref: 2220907d3119897b8bd58cbc3c926787cd05ed2c
          path: temp/OpenSearch
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed benchmark dependencies
        run: python -m pip install -r eval/requirements-benchmark.txt
      - name: Download and verify fixed Joern release
        shell: bash
        run: |
          mkdir -p temp/joern
          curl --fail --location --retry 2 --max-time 600 --retry-max-time 600 \
            https://github.com/joernio/joern/releases/download/v4.0.689/joern-cli-linux-x86_64.zip \
            --output temp/joern/joern.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path
          with Path('temp/joern/joern.zip').open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          expected = 'c13f0b6adbb1ea2fbf94c046e42ae023394f150f855ca6ca19ef20e20a1805b0'
          if actual != expected:
              raise SystemExit(f'Joern archive digest mismatch: {actual}')
          PY
          unzip -q temp/joern/joern.zip -d temp/joern
      - name: Prepare one DOT per fixed source scope
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p output/preparation-environment
          java -version > output/preparation-environment/java.txt 2>&1
          python -m pip freeze > output/preparation-environment/python.txt
          lscpu > output/preparation-environment/cpu.txt
          free -b > output/preparation-environment/memory.txt
          python -m eval.controlled_benchmark prepare \
            --source-checkout temp/OpenSearch \
            --joern-home temp/joern/joern-cli \
            --output output/preparation \
            --timeout-sec 300 --max-rss-mib 4096
      - name: Save prepared inputs and parse diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/preparation/inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Save native preparation environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/preparation-environment/
          if-no-files-found: warn
          retention-days: 14

  compare-methods:
    needs: prepare-cpg
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed benchmark dependencies
        run: python -m pip install -r eval/requirements-benchmark.txt
      - name: Fetch the fixed upstream baseline file
        run: git fetch --no-tags --depth=1 https://github.com/ch4t5ky/cpg_rca.git f8bb418fc3eeb514f4b1dfc1fdce8040470fe3e8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: controlled-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-inputs
      - name: Run three alternating pairs in new processes
        run: |
          python -m eval.controlled_benchmark compare \
            --inputs output/controlled-inputs --scope snapshots \
            --output output/method-comparison --repeats 3 \
            --timeout-sec 600 --max-rss-mib 4096
      - name: Save all samples, generated JSON, and equality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-methods-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/method-comparison/
          if-no-files-found: error
          retention-days: 14

  reader-equivalence:
    needs: prepare-cpg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed benchmark dependencies
        run: python -m pip install -r eval/requirements-benchmark.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: controlled-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-inputs
      - name: Check full ordered graphs and serialized artifacts
        run: |
          python -m eval.controlled_benchmark readers \
            --inputs output/controlled-inputs --output output/reader-equality \
            --timeout-sec 180 --max-rss-mib 2048
      - name: Save reader equality and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-readers-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/reader-equality/
          if-no-files-found: error
          retention-days: 14
