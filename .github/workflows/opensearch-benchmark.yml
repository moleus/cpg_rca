name: OpenSearch CPG benchmark

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Public OpenSearch source scope
        type: choice
        default: snapshots
        options:
          - notifier
          - snapshots
          - recovery
          - server
          - repository
      dot_parser:
        description: DOT loader under test
        type: choice
        default: joern
        options:
          - joern
          - pydot
  push:
    branches:
      - research/rca-validation-2026-11-22
    paths:
      - .github/workflows/opensearch-benchmark.yml
      - eval/benchmark.py
      - eval/measure_command.py
      - eval/opensearch_benchmark.py
      - eval/requirements-benchmark.txt
      - builder.py
      - src/offline/**

permissions:
  contents: read

concurrency:
  group: opensearch-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCHMARK_SCOPE: ${{ inputs.scope || 'snapshots' }}
      BENCHMARK_PARSER: ${{ inputs.dot_parser || 'joern' }}
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opensearch-project/OpenSearch
          ref: 2220907d3119897b8bd58cbc3c926787cd05ed2c
          path: temp/OpenSearch
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install -r eval/requirements-benchmark.txt
      - name: Download pinned Joern release
        shell: bash
        run: |
          mkdir -p temp/joern
          curl --fail --location --retry 2 --max-time 600 \
            https://github.com/joernio/joern/releases/download/v4.0.689/joern-cli-linux-x86_64.zip \
            --output temp/joern/joern.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path
          archive = Path('temp/joern/joern.zip')
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          expected = 'c13f0b6adbb1ea2fbf94c046e42ae023394f150f855ca6ca19ef20e20a1805b0'
          if actual != expected:
              raise SystemExit(f'Joern archive digest mismatch: {actual}')
          PY
          unzip -q temp/joern/joern.zip -d temp/joern
      - name: Record environment
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p output/benchmark-environment
          java -version > output/benchmark-environment/java.txt 2>&1
          python -m pip freeze > output/benchmark-environment/python.txt
          lscpu > output/benchmark-environment/cpu.txt
          free -b > output/benchmark-environment/memory.txt
      - name: Run one-file smoke with the default parser
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python -m eval.opensearch_benchmark \
            --source-checkout temp/OpenSearch \
            --joern-home temp/joern/joern-cli \
            --scope notifier \
            --dot-parser pydot \
            --output output/smoke \
            --stage-timeout-sec 120 \
            --max-rss-mib 2048
      - name: Build CPG and measure selected scope
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python -m eval.opensearch_benchmark \
            --source-checkout temp/OpenSearch \
            --joern-home temp/joern/joern-cli \
            --scope "$BENCHMARK_SCOPE" \
            --dot-parser "$BENCHMARK_PARSER" \
            --output output/opensearch \
            --stage-timeout-sec 600 \
            --max-rss-mib 4096
      - name: Save measurements and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opensearch-cpg-${{ env.BENCHMARK_SCOPE }}-${{ env.BENCHMARK_PARSER }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/benchmark-environment/
            output/opensearch/*.json
            output/opensearch/*.log
            output/opensearch/pipeline/benchmark.json
            output/smoke/*.json
            output/smoke/*.log
            output/smoke/pipeline/benchmark.json
