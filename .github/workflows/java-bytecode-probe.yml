name: Java bytecode fixture probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/java-frontend-comparison
    paths:
      - .github/workflows/java-bytecode-probe.yml
      - eval/java_bytecode_probe.py
      - eval/JdkTool.java
      - eval/JAVA_BYTECODE_PROBE.md
      - tests/test_java_bytecode_probe.py

permissions:
  contents: read

concurrency:
  group: java-bytecode-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install measurement dependencies
        run: python -m pip install -r eval/requirements-benchmark.txt
      - name: Record environment
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p output/java-bytecode-environment
          java -version > output/java-bytecode-environment/java.txt 2>&1
          python -m pip freeze > output/java-bytecode-environment/python.txt
          lscpu > output/java-bytecode-environment/cpu.txt
          free -b > output/java-bytecode-environment/memory.txt
      - name: Download pinned Joern distribution
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p temp/joern
          curl --fail --location --retry 1 --max-time 240 \
            https://github.com/joernio/joern/releases/download/v4.0.689/joern-cli-linux-x86_64.zip \
            --output temp/joern/joern.zip
          python - <<'PY'
          from pathlib import Path
          from eval.java_frontend_compare import digest
          from eval.opensearch_benchmark import JOERN_ARCHIVE_SHA256
          actual = digest(Path('temp/joern/joern.zip'))
          if actual != JOERN_ARCHIVE_SHA256:
              raise SystemExit(f'Joern checksum mismatch: {actual}')
          PY
          unzip -q temp/joern/joern.zip -d temp/joern
      - name: Compile and inspect two bytecode fixtures
        timeout-minutes: 12
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python -m eval.java_bytecode_probe run \
            --joern-home temp/joern/joern-cli \
            --joern-archive temp/joern/joern.zip \
            --output output/java-bytecode \
            --parse-timeout-sec 120 \
            --export-timeout-sec 60 \
            --max-rss-mib 2048
      - name: Save measurements, quality gates, and javap proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-bytecode-fixtures-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            output/java-bytecode-environment/
            output/java-bytecode/*.json
            output/java-bytecode/*.log
            output/java-bytecode/runs/**/*.json
            output/java-bytecode/runs/**/*.log
