name: Compact runtime history experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/compact-runtime-history
    paths:
      - .github/workflows/compact-history.yml
      - src/online/**
      - tests/test_compact_history.py
      - eval/benchmark_compact_history.py
      - eval/measure_command.py
      - eval/requirements-test.txt
      - eval/requirements-benchmark.txt

permissions:
  contents: read

concurrency:
  group: compact-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r eval/requirements-test.txt
      - name: Compare store and report outputs
        run: python -m pytest -q --junitxml=output/history-tests.xml
      - name: Measure copied and compact histories
        run: >-
          python -m eval.benchmark_compact_history
          --sizes 100 500 1000 5000 --repeats 3
          --timeout-sec 30 --max-rss-mib 1024
          --output output/compact-history.json
      - name: Save tests, measurements and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compact-history-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error
