name: Active hypothesis index experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/active-hypothesis-index
    paths:
      - .github/workflows/active-hypothesis-index.yml
      - src/online/**
      - tests/test_active_hypothesis_index.py
      - eval/benchmark_active_index.py
      - eval/benchmark_compact_history.py
      - eval/measure_command.py
      - eval/requirements-test.txt
      - eval/requirements-benchmark.txt

permissions:
  contents: read

concurrency:
  group: active-hypothesis-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r eval/requirements-test.txt
      - name: Check evidence and public mutation compatibility
        run: python -m pytest -q --junitxml=output/active-index-tests.xml
      - name: Compare scan and index on the same input
        run: >-
          python -m eval.benchmark_active_index
          --sizes 100 1000 5000 20000 --repeats 3
          --timeout-sec 120 --max-rss-mib 1024
          --output output/active-index.json
      - name: Save tests, measurements and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: active-hypothesis-index-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: error
